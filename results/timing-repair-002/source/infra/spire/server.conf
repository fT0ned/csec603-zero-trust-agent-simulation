server {
  bind_address = "0.0.0.0"
  bind_port = "8081"
  socket_path = "/run/spire/server/api.sock"
  trust_domain = "csec603.test"
  data_dir = "/var/lib/spire/server"
  log_level = "INFO"
  log_format = "json"
  default_x509_svid_ttl = "2h"
  default_jwt_svid_ttl = "15m"
  ca_ttl = "72h"
}
plugins {
  DataStore "sql" {
    plugin_data {
      database_type = "sqlite3"
      connection_string = "/var/lib/spire/server/datastore.sqlite3"
    }
  }
  NodeAttestor "join_token" { plugin_data {} }
  KeyManager "disk" { plugin_data { keys_path = "/var/lib/spire/server/keys.json" } }
}
health_checks {
  listener_enabled = true
  bind_address = "0.0.0.0"
  bind_port = "8080"
  live_path = "/live"
  ready_path = "/ready"
}
